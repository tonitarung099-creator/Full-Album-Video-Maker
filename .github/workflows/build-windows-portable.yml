name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build one-folder EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Full Album Maker" --paths "$PWD\src" "$PWD\src\full_album_maker\main.py"

      - name: Bundle LGPL FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_unpack
          $ffmpeg = Get-ChildItem ffmpeg_unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg_unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force "dist\Full Album Maker\tools\ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "dist\Full Album Maker\tools\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "dist\Full Album Maker\tools\ffmpeg\ffprobe.exe"
          Copy-Item LICENSE "dist\Full Album Maker\LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\Full Album Maker\THIRD_PARTY_NOTICES.md"
          New-Item -ItemType Directory -Force "dist\Full Album Maker\data" | Out-Null
          New-Item -ItemType Directory -Force "dist\Full Album Maker\temp" | Out-Null
          New-Item -ItemType Directory -Force "dist\Full Album Maker\output" | Out-Null

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Full Album Maker\*" -DestinationPath "Full-Album-Maker-Windows-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Full-Album-Maker-Windows-Portable
          path: Full-Album-Maker-Windows-Portable.zip
          if-no-files-found: error
